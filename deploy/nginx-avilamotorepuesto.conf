# ==============================================================
# Nginx — avilamotorepuesto.com.ar
# Web pública: avilamotorepuesto.com.ar
# POS privado: pos.avilamotorepuesto.com.ar
#
# Copiar a: /etc/nginx/sites-available/avilamotorepuesto
# Activar:  ln -s /etc/nginx/sites-available/avilamotorepuesto /etc/nginx/sites-enabled/
# ==============================================================

# Redirigir HTTP → HTTPS (todos los dominios)
server {
    listen 80;
    server_name avilamotorepuesto.com.ar www.avilamotorepuesto.com.ar pos.avilamotorepuesto.com.ar;
    return 301 https://$host$request_uri;
}

# ==============================================================
# WEB PÚBLICA — avilamotorepuesto.com.ar / www.avilamotorepuesto.com.ar
# ==============================================================
server {
    listen 443 ssl http2;
    server_name avilamotorepuesto.com.ar www.avilamotorepuesto.com.ar;

    # SSL — Let's Encrypt (Certbot los agrega automáticamente)
    ssl_certificate     /etc/letsencrypt/live/avilamotorepuesto.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avilamotorepuesto.com.ar/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Logs
    access_log /var/log/nginx/avila-web-access.log;
    error_log  /var/log/nginx/avila-web-error.log;

    # Tamaño máximo de subida
    client_max_body_size 20M;

    # Redirección www → sin www
    if ($host = www.avilamotorepuesto.com.ar) {
        return 301 https://avilamotorepuesto.com.ar$request_uri;
    }

    # No indexar nada de /api/ en la web pública
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Archivos media (imágenes de productos, etc.)
    location /media/ {
        alias /srv/avilapos/backend/media/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        # No servir archivos sensibles desde media
        location ~* \.(py|sh|env|key|pem|crt|sql|sqlite3)$ {
            deny all;
        }
    }

    # Archivos estáticos Django (admin, DRF browsable)
    location /static/ {
        alias /srv/avilapos/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # robots.txt para web pública (permite indexación)
    location = /robots.txt {
        alias /srv/avilapos/avila-web/dist/robots.txt;
    }

    # Frontend React (avila-web) — SPA
    location / {
        root  /srv/avilapos/avila-web/dist;
        index index.html;
        # SPA fallback: todas las rutas van al index.html
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache agresivo para assets compilados (tienen hash en nombre)
    location ~* ^/assets/.+\.(js|css|png|jpg|svg|woff2?)$ {
        root    /srv/avilapos/avila-web/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ==============================================================
# POS PRIVADO — pos.avilamotorepuesto.com.ar
# ==============================================================
server {
    listen 443 ssl http2;
    server_name pos.avilamotorepuesto.com.ar;

    # SSL — Let's Encrypt (Certbot los agrega automáticamente)
    ssl_certificate     /etc/letsencrypt/live/pos.avilamotorepuesto.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.avilamotorepuesto.com.ar/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Logs
    access_log /var/log/nginx/pos-access.log;
    error_log  /var/log/nginx/pos-error.log;

    # Tamaño máximo de subida (comprobantes, imágenes)
    client_max_body_size 20M;

    # No indexar el POS en buscadores
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

    # robots.txt bloqueante para el POS
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    # API Django
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Admin Django
    location /admin/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Archivos media
    location /media/ {
        alias /srv/avilapos/backend/media/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        location ~* \.(py|sh|env|key|pem|crt|sql|sqlite3)$ {
            deny all;
        }
    }

    # Archivos estáticos Django
    location /static/ {
        alias /srv/avilapos/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend React POS — SPA
    location / {
        root  /srv/avilapos/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache para assets del POS
    location ~* ^/assets/.+\.(js|css|png|jpg|svg|woff2?)$ {
        root    /srv/avilapos/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
